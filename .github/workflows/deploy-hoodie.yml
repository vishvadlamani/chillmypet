name: Deploy hoodie landing page

# Publishes landing/pouch-pet-hoodie to the chillmypet-hoodie Pages project
# (https://chillmypet-hoodie.pages.dev). Separate from the storefront Worker
# and possibly on another Cloudflare account, so it has its own secrets:
# HOODIE_CLOUDFLARE_API_TOKEN (Pages: Edit) and HOODIE_CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main, claude/epic-feynman-3f0a70]
    paths: ['landing/pouch-pet-hoodie/**', '.github/workflows/deploy-hoodie.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.HOODIE_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HOODIE_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set HOODIE_CLOUDFLARE_API_TOKEN and HOODIE_CLOUDFLARE_ACCOUNT_ID in the repo's Actions secrets"
            exit 1
          fi
      - uses: actions/checkout@v4
      # The README names the Stripe account and isn't part of the page.
      - run: rsync -a --exclude README.md landing/pouch-pet-hoodie/ dist/ && ls -la dist
      # Deploy to the project's production branch, whatever it is, so this is
      # never a preview deploy named after the git branch.
      - id: project
        run: |
          branch=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chillmypet-hoodie" \
            | jq -r '.result.production_branch')
          echo "production branch: $branch"
          test -n "$branch" && test "$branch" != null
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - run: npx --yes wrangler@4 pages deploy dist --project-name chillmypet-hoodie --branch "${{ steps.project.outputs.branch }}" --commit-dirty=true
