name: Deploy hoodie page

# Publishes landing/pouch-pet-hoodie to chillmypet-hoodie.pages.dev on every
# merge that changes it, and on demand. The project is on the business owner's
# Cloudflare account (5fef1d1d…), the same one as the Christmas page, so it uses
# the same OWNER_CLOUDFLARE_API_TOKEN. An earlier version of this workflow used
# CLOUDFLARE_WORKERS, which only reaches Vish's account and could never find
# the project; that is why it was removed on 2026-10-07.
on:
  push:
    branches: [main]
    paths:
      - 'landing/pouch-pet-hoodie/**'
      - 'landing/pouch-pet-hoodie.test.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Step conditions cannot read secrets, so only whether it exists.
      HAS_TOKEN: ${{ secrets.OWNER_CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node landing/pouch-pet-hoodie.test.mjs

      - name: Report that nothing was deployed
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning title=Hoodie page was NOT deployed::OWNER_CLOUDFLARE_API_TOKEN is not a repository secret. Add a token for Cloudflare account 5fef1d1dbb6eaee72fdfc2b26a61a386 under Settings > Secrets and variables > Actions, then re-run."
          {
            echo "## ⚠️ chillmypet-hoodie.pages.dev was not deployed"
            echo
            echo "Tests passed. The repository has no \`OWNER_CLOUDFLARE_API_TOKEN\` secret, a token for the Cloudflare account that holds the page, so the live page is unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        run: sh landing/pouch-pet-hoodie/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OWNER_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5fef1d1dbb6eaee72fdfc2b26a61a386
