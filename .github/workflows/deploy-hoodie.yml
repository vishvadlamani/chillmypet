name: Deploy hoodie landing page

# Publishes landing/pouch-pet-hoodie to the chillmypet-hoodie Pages project
# (https://chillmypet-hoodie.pages.dev), so nobody needs a Cloudflare login to
# ship a change to it: edit the folder, merge, and this runs.
#
# Uses CLOUDFLARE_WORKERS, the token the storefront deploys with. It first looks
# for the chillmypet-hoodie project in every account that token can see, and
# stops before deploying if there is none — `pages deploy` against an account
# without the project would create a second, empty one instead of updating the
# live page.

on:
  push:
    branches: [main, claude/upbeat-galileo-gglczj]
    paths: ['landing/pouch-pet-hoodie/**', '.github/workflows/deploy-hoodie.yml']
  workflow_dispatch:

concurrency: deploy-hoodie

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the project and its production branch
        id: project
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_WORKERS repository secret is empty. Nothing was deployed."
            exit 1
          fi
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          accounts=$(api /accounts)
          for account in $(echo "$accounts" | jq -r '.result[]?.id'); do
            project=$(api "/accounts/$account/pages/projects/chillmypet-hoodie")
            branch=$(echo "$project" | jq -r '.result.production_branch // empty')
            # Cloudflare's own answer, so a missing project (8000007) and a token
            # without Pages permission (10000) are told apart.
            [ -n "$branch" ] || echo "$project" | jq -c '{account: "'"$account"'", errors}'
            if [ -n "$branch" ]; then
              echo "Found chillmypet-hoodie in $(echo "$accounts" | jq -r --arg a "$account" '.result[] | select(.id == $a) | .name'), production branch: $branch"
              echo "account=$account" >> "$GITHUB_OUTPUT"
              echo "branch=$branch" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::This token cannot see a Pages project named chillmypet-hoodie. Nothing was deployed."
          echo "$accounts" | jq '{success, errors, accounts: [.result[]? | .name]}'
          # Every Pages project the token can list, if it may list them at all.
          for account in $(echo "$accounts" | jq -r '.result[]?.id'); do
            api "/accounts/$account/pages/projects" | jq -c '{success, errors, projects: [.result[]? | .name]}'
          done
          exit 1

      # The README names the Stripe account and is not part of the page.
      - name: Build
        run: |
          mkdir dist
          cp -a landing/pouch-pet-hoodie/. dist/
          rm dist/README.md
          ls -la dist

      # To the project's production branch, so this is never a preview deploy
      # named after the git branch.
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.project.outputs.account }}
        run: npx --yes wrangler@4 pages deploy dist --project-name chillmypet-hoodie --branch "${{ steps.project.outputs.branch }}" --commit-dirty=true

      - name: Check the live page
        run: |
          base=https://chillmypet-hoodie.pages.dev
          for attempt in 1 2 3 4 5 6; do
            fail=0
            for c in black gray pink cream; do
              type=$(curl -s -o /dev/null -w '%{content_type}' "$base/hoodie-$c.jpg?cb=$GITHUB_RUN_ID-$attempt")
              echo "hoodie-$c.jpg: $type"
              [[ "$type" == image/jpeg* ]] || fail=1
            done
            curl -s "$base/config.js?cb=$GITHUB_RUN_ID-$attempt" | grep -q "id: 'cream'" || { echo "config.js is not the four-colour one yet"; fail=1; }
            [ "$fail" = 0 ] && break
            sleep 20
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/event" -d x)
          echo "POST /api/event: $status (400 means the server-side worker is running)"
          exit $fail
