name: Deploy retired landing pages

# Publishes landing/retired, a redirect to the costume on chillmypet.com, to
# both retired landing page projects (chillmypet-christmas.pages.dev and
# chillmypet-hoodie.pages.dev) on every merge that changes it, and on demand.
# Both projects are on the business owner's Cloudflare account (5fef1d1d…),
# not Vish's account that runs chillmypet.com, so they need their own token:
# OWNER_CLOUDFLARE_API_TOKEN. Until this runs, each address keeps serving the
# last page uploaded to it.
on:
  push:
    branches: [main]
    paths:
      - 'landing/retired/**'
      - 'landing/retired.test.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Step conditions cannot read secrets, so only whether it exists.
      HAS_TOKEN: ${{ secrets.OWNER_CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node landing/retired.test.mjs

      - name: Report that nothing was deployed
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning title=Retired landing pages were NOT deployed::OWNER_CLOUDFLARE_API_TOKEN is not a repository secret. Add a token for Cloudflare account 5fef1d1dbb6eaee72fdfc2b26a61a386 under Settings > Secrets and variables > Actions, then re-run."
          {
            echo "## ⚠️ The retired landing pages were not deployed"
            echo
            echo "Tests passed. The repository has no \`OWNER_CLOUDFLARE_API_TOKEN\` secret, a token for the Cloudflare account that holds both pages, so they still serve their last upload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        run: sh landing/retired/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OWNER_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5fef1d1dbb6eaee72fdfc2b26a61a386
