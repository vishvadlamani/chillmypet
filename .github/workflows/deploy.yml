name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Step conditions cannot read secrets, so whether each one exists is
      # worked out here. Never the value, only true or false.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_TURSO: ${{ secrets.TURSO_DATABASE_URL != '' && secrets.TURSO_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Before the build, because this is the check for a failure nothing else
      # catches: a Conversions API token that belongs to another dataset is
      # rejected once per event, forever, in silence. Needs
      # META_CAPI_ACCESS_TOKEN as a repository secret. Only when this run is
      # going to deploy: without the Cloudflare token nothing ships, and a
      # missing Meta secret then failed every merge for a deploy that was
      # never going to happen.
      - name: Verify the Meta CAPI token matches the pixel
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        run: npm run meta:check
        env:
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
      - run: npm run build

      # A product page is code AND a row. The manifest in src/lib/store/pages.ts
      # ships with the Worker, but it serves nothing until the product it names
      # is in the live database — and that is exactly how
      # /products/christmas-pouch-hoodie was a 404 on chillmypet.com for days
      # after the page itself had deployed: the Worker answered "No product at",
      # because nobody had run db:products against Turso. So the deploy brings
      # the database up to date first. Both scripts are safe to repeat:
      # db:migrate is create-if-not-exists, and db:products only adds products
      # the store lacks — it never rewrites one that is selling. It runs before
      # wrangler deploy so a database the code cannot serve from stops the
      # release, the same way a failing check would.
      - name: Bring the live database up to date with the code
        if: env.HAS_CLOUDFLARE_TOKEN == 'true' && env.HAS_TURSO == 'true'
        run: npm run db:migrate && npm run db:products
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # Without the Turso secrets the Worker still ships, but any product the
      # code knows and the database lacks stays a 404. Said out loud, with the
      # command, because a quiet skip is how that 404 went unnoticed.
      - name: Report that the database was not updated
        if: env.HAS_CLOUDFLARE_TOKEN == 'true' && env.HAS_TURSO != 'true'
        run: |
          echo "::warning title=Live database NOT updated::TURSO_DATABASE_URL and TURSO_AUTH_TOKEN are not both repository secrets, so db:migrate and db:products did not run. A product page whose row is missing from Turso stays a 404 until someone runs them by hand."
          {
            echo "## ⚠️ The live database was not brought up to date"
            echo
            echo "The Worker deploys below, but \`npm run db:migrate\` and \`npm run db:products\` were skipped because \`TURSO_DATABASE_URL\` and \`TURSO_AUTH_TOKEN\` are not both repository secrets."
            echo
            echo "Either add them under **Settings › Secrets and variables › Actions** (the same values the Worker holds), or run from a machine with the credentials:"
            echo
            echo '```sh'
            echo 'export TURSO_DATABASE_URL=libsql://chillmypet-vish.aws-us-west-2.turso.io'
            echo 'export TURSO_AUTH_TOKEN=…'
            echo 'npm run db:migrate && npm run db:products'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # CLOUDFLARE_API_TOKEN has been a repository secret since 2026-10-11, so a
      # merge to main is a release. The fallback stays: if the secret ever goes
      # missing the run says, on its summary page, that nothing was deployed,
      # rather than failing or passing quietly — a green run with that warning
      # means production did not change.
      - name: Report that nothing was deployed
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: |
          echo "::warning title=chillmypet.com was NOT deployed::CLOUDFLARE_API_TOKEN is not a repository secret, so this run only checked, tested and built the code. Production is unchanged. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions, or deploy by hand."
          {
            echo "## ⚠️ chillmypet.com was not deployed"
            echo
            echo "Check, tests and build passed. The deploy was skipped because the repository has no \`CLOUDFLARE_API_TOKEN\` secret, so production is still running whatever was last deployed."
            echo
            echo "To deploy on every merge, add \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` under **Settings › Secrets and variables › Actions** (see README › Deploying), then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - run: npx wrangler deploy
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        working-directory: apps/storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
