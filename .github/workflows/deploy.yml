name: Deploy payment sandbox

# This branch is only a manual deployment launcher. Do not merge it into main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chillmypet-payment-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Deploy only the separate payment sandbox
        run: npx wrangler deploy --config wrangler.payment-test.toml
        working-directory: apps/storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Explain the activation step
        run: |
          {
            echo '## Payment sandbox deployed'
            echo
            echo 'The Worker is chillmypet-payment-test. Production was not deployed.'
            echo 'Configure sandbox-only Stripe keys, webhook secret, an owner password, database credentials, and Meta Test Events settings in its Cloudflare settings.'
            echo 'It stays unavailable until sandbox keys and the webhook secret are configured.'
          } >> "$GITHUB_STEP_SUMMARY"
