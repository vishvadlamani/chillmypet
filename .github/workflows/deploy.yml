name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Before the build, because this is the check for a failure nothing else
      # catches: a Conversions API token that belongs to another dataset is
      # rejected once per event, forever, in silence. Needs
      # META_CAPI_ACCESS_TOKEN as a repository secret.
      - name: Verify the Meta CAPI token matches the pixel
        run: npm run meta:check
        env:
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
      - run: npm run build
      - run: npx wrangler deploy
        working-directory: apps/storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
