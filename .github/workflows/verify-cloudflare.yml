name: Verify Cloudflare access

# Read-only: proves the repository secrets reach the right Cloudflare account
# without deploying anything. Deploy is the only other workflow holding the
# token, and running it ships whatever main is to chillmypet.com.

on:
  workflow_dispatch:
  push:
    branches: [claude/vibrant-brahmagupta-xss8vy]
    paths: [.github/workflows/verify-cloudflare.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets are present
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is empty"; exit 1; }
      - name: Token authenticates
        run: npx --yes wrangler@4 whoami
      - name: Account holds the production Worker
        run: npx --yes wrangler@4 deployments list --name chillmypet
      - name: Account holds the staging Worker
        run: npx --yes wrangler@4 deployments list --name chillmypet-staging
