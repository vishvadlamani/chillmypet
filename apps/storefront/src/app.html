<!doctype html>
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%meta_domain_verification%
		%gtm_head%
		<!-- The brand's teal paw (owner's artwork, 2026-10-17). The icon before
		     it was SvelteKit's default logo. -->
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/brand/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/brand/icon-192.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/apple-touch-icon.png" />
		<meta name="theme-color" content="#0b3c49" />
		%meta_pixel%
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Immediately after <body>, which is where Google's own instructions put
		     it and where a tag that has to run without JavaScript belongs. -->
		%gtm_body%
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
