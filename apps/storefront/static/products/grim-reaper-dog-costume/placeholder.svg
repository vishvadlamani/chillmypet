<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img"
     aria-label="Illustration of a dog wearing a hooded rider costume, standing under a full moon">
  <!--
    PLACEHOLDER. Not a photograph, and deliberately not trying to be one.

    There is no product photography for this costume yet, and the only images
    that exist of it belong to the sellers running the ad. Drawing our own says
    what the product is without borrowing anyone's picture and without pretending
    to show the item that ships. Replace it with real photos before spending on
    traffic — see the gallery note in $lib/store/halloween-manifest.ts.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a38"/>
      <stop offset="60%" stop-color="#3b2550"/>
      <stop offset="100%" stop-color="#4a2a49"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6b45a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f6b45a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>
  <circle cx="565" cy="235" r="230" fill="url(#glow)"/>
  <circle cx="565" cy="235" r="118" fill="#f3ad4f"/>
  <circle cx="530" cy="205" r="17" fill="#e79f45"/>
  <circle cx="600" cy="270" r="12" fill="#e79f45"/>
  <circle cx="588" cy="192" r="8" fill="#e79f45"/>

  <g fill="#fff" opacity="0.5">
    <circle cx="120" cy="130" r="3"/><circle cx="215" cy="80" r="2"/>
    <circle cx="300" cy="175" r="2.5"/><circle cx="90" cy="260" r="2"/>
    <circle cx="700" cy="440" r="2.5"/><circle cx="740" cy="120" r="2"/>
    <circle cx="170" cy="330" r="2"/>
  </g>

  <!-- ground -->
  <path d="M0 640 q140 -34 280 -10 t280 6 t240 -14 V800 H0 Z" fill="#1a1226"/>
  <ellipse cx="400" cy="648" rx="215" ry="20" fill="#0d0916" opacity="0.55"/>

  <!-- dog -->
  <g fill="#120e1c">
    <rect x="252" y="452" width="284" height="128" rx="64"/>
    <rect x="278" y="556" width="36" height="96" rx="18"/>
    <rect x="346" y="560" width="36" height="92" rx="18"/>
    <rect x="452" y="556" width="36" height="96" rx="18"/>
    <rect x="506" y="560" width="36" height="92" rx="18"/>
    <path d="M258 470 q-52 -26 -74 -78 q34 8 52 34 q14 20 22 44 Z"/>
    <circle cx="556" cy="452" r="66"/>
    <rect x="588" y="452" width="102" height="52" rx="26"/>
    <circle cx="684" cy="470" r="13" fill="#241a38"/>
    <path d="M524 398 q-16 -62 24 -84 q26 30 22 82 Z"/>
    <circle cx="578" cy="430" r="7" fill="#f3ad4f"/>
  </g>

  <!-- rider: hood, cloak, scythe -->
  <g>
    <path d="M312 214 q34 -22 58 6 q-30 4 -44 22 Z" fill="#c9c4d6"/>
    <rect x="336" y="228" width="9" height="214" rx="4.5" fill="#6b5b45"/>
    <path d="M356 452 q-22 -104 6 -142 q34 -12 66 2 q30 40 8 140 Z" fill="#1d1630"/>
    <path d="M362 452 q-16 -92 6 -128 q10 24 6 128 Z" fill="#2b2145" opacity="0.9"/>
    <circle cx="393" cy="300" r="41" fill="#1d1630"/>
    <path d="M393 259 a41 41 0 0 1 34 64 q-34 16 -68 0 a41 41 0 0 1 34 -64 Z" fill="#231a3c"/>
    <ellipse cx="393" cy="308" rx="24" ry="27" fill="#08060f"/>
    <circle cx="384" cy="304" r="5" fill="#f3ad4f"/>
    <circle cx="402" cy="304" r="5" fill="#f3ad4f"/>
  </g>
</svg>
