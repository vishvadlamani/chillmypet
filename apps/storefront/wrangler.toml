name = "chillmypet"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

# A pixel id is public — it ships to the browser by design — so these are vars,
# not secrets, and the same goes for the GTM container.
#
# META_PIXEL_ID is the dataset that matters: browser events *and* the server-side
# Conversions API copy both report to it, so it must be the pixel the ad account
# optimises against, and META_CAPI_ACCESS_TOKEN must be generated for this same
# pixel. A token belongs to one dataset; pointed at any other pixel, that pixel
# gets browser events only.
#
# META_EXTRA_PIXEL_IDS are additional pixels measuring the same pages,
# comma-separated. They share the one loader and every event, but get no CAPI.
#
# The pairing, because the primary is only correct relative to an ad account:
# dataset 1341978141149107 (USD) is the one ad account 1431226177195979
# optimises against, and the current campaign runs there — so it is the primary
# and META_CAPI_ACCESS_TOKEN must be its token. 1363695699271757 is the old
# dataset behind ad account 1550461850095009, kept browser-only so its history
# stays intact; nothing optimises against it any more. Moving the primary
# without regenerating the token for the new dataset silently ends the CAPI
# half: Meta rejects events signed for another dataset, and the rejection only
# reaches console.error.
[vars]
META_PIXEL_ID = "1341978141149107"
META_EXTRA_PIXEL_IDS = "1363695699271757"
GTM_CONTAINER_ID = "GTM-T446VNH9"

# Domain verification, comma-separated, one token per business portfolio that
# claims chillmypet.com. Both datasets' portfolios are listed: the new one
# first, because it is the one being verified now, and the old one kept so the
# portfolio behind 1363695699271757 does not silently lose the domain it
# already holds. Drop a token here when its portfolio no longer needs it.
#
# This overrides the store's meta_domain_verification row. Prefer it: the
# settings lookup in hooks.server.ts is cached per isolate with no
# invalidation, so a row written to the live database is not necessarily
# served, while a var here ships with the deploy.
META_DOMAIN_VERIFICATION = "63udjzub2h5zadk4jhv78qem6hul1f,0d821f82wjdsr4q7owd17wo659qt6h"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Custom-domain routes only resolve once chillmypet.com is an active zone on the
# same Cloudflare account; deploys fail with "zone not found" until it is.
[[routes]]
pattern = "chillmypet.com"
custom_domain = true

[[routes]]
pattern = "www.chillmypet.com"
custom_domain = true
