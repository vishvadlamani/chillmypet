name = "chillmypet"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

# A pixel id is public — it ships to the browser by design — so these are vars,
# not secrets, and the same goes for the GTM container.
#
# There are three tiers here, and which one a pixel sits in decides whether the
# ad account optimising against it can see a conversion an ad blocker ate.
#
# META_PIXEL_ID is the primary dataset: browser events plus the server-side
# Conversions API copy, authorised by the META_CAPI_ACCESS_TOKEN secret.
#
# META_PIXEL_ID_2 (through _9) are further datasets that get both halves too. A
# token authorises exactly one dataset, so each needs its own, paired by suffix —
# META_PIXEL_ID_2 with META_CAPI_ACCESS_TOKEN_2. The id goes here, the token goes
# in `wrangler secret put`. An id whose token has not been generated yet still
# initialises in the browser; it just gets no server copy until the token lands.
#
# META_EXTRA_PIXEL_IDS are pixels measuring the same pages with no CAPI at all,
# comma-separated. They share the one loader and every browser event — which is
# precisely the half iOS and ad blockers eat, so no campaign should optimise
# against one of these.
[vars]
# Ad account 1431226177195979, also shared with 1550461850095009.
META_PIXEL_ID = "1363695699271757"
# The USD dataset on ad account 1550461850095009. Needs META_CAPI_ACCESS_TOKEN_2.
META_PIXEL_ID_2 = "1341978141149107"
META_EXTRA_PIXEL_IDS = "28272021345717397"
GTM_CONTAINER_ID = "GTM-T446VNH9"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Custom-domain routes only resolve once chillmypet.com is an active zone on the
# same Cloudflare account; deploys fail with "zone not found" until it is.
[[routes]]
pattern = "chillmypet.com"
custom_domain = true

[[routes]]
pattern = "www.chillmypet.com"
custom_domain = true
