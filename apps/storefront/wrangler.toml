name = "chillmypet"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

# A pixel id is public — it ships to the browser by design — so these are vars,
# not secrets, and the same goes for the GTM container.
#
# META_PIXEL_ID is the dataset that matters: browser events *and* the server-side
# Conversions API copy both report to it, so it must be the pixel the ad account
# optimises against, and META_CAPI_ACCESS_TOKEN must be generated for this same
# pixel. A token belongs to one dataset; pointed at any other pixel, that pixel
# gets browser events only.
#
# META_EXTRA_PIXEL_IDS are additional pixels measuring the same pages,
# comma-separated. They share the one loader and every event, but get no CAPI.
#
# Which id belongs to whom, because the numbers are unmemorable and picking the
# wrong one is a silent month of zero reported conversions:
#
#   1341978141149107  ad account 1550461850095009, portfolio "Vish Ads"
#                     (239590337358646) — the account that runs the ads, so the
#                     one that must get both halves. Meta merged pixel and
#                     dataset into one object, so this single id is both.
#   1363695699271757  ad account 1431226177195979 — retired. It priced in CZK
#                     with no way to change it. Kept here for browser events
#                     only so its history keeps accruing and nothing is lost;
#                     it no longer receives the Conversions API copy.
#   28272021345717397 a second account measuring the same pages. Browser only.
#
# ⚠️ DEPLOY ORDER. A CAPI token belongs to exactly one dataset. Until
# META_CAPI_ACCESS_TOKEN is regenerated for 1341978141149107 and put on both
# Workers, deploying this file sends server events to a dataset the live token
# does not cover and Meta rejects every one — silently, into console.error,
# because tracking must never fail an order. Set the secret first, deploy
# second, then confirm in Events Manager that the dataset shows both a browser
# and a server copy of the same event.
[vars]
META_PIXEL_ID = "1341978141149107"
META_EXTRA_PIXEL_IDS = "1363695699271757,28272021345717397"
GTM_CONTAINER_ID = "GTM-T446VNH9"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Custom-domain routes only resolve once chillmypet.com is an active zone on the
# same Cloudflare account; deploys fail with "zone not found" until it is.
[[routes]]
pattern = "chillmypet.com"
custom_domain = true

[[routes]]
pattern = "www.chillmypet.com"
custom_domain = true
