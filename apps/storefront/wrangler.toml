name = "chillmypet"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

# Extra Meta pixels measuring this store, beyond the one in store_settings.
# Comma-separated. A pixel id is public — it ships to the browser by design —
# so these are vars, not secrets, and the same goes for the GTM container.
[vars]
META_EXTRA_PIXEL_IDS = "1363695699271757"
GTM_CONTAINER_ID = "GTM-N3Q25P9X"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Custom-domain routes only resolve once chillmypet.com is an active zone on the
# same Cloudflare account; deploys fail with "zone not found" until it is.
[[routes]]
pattern = "chillmypet.com"
custom_domain = true

[[routes]]
pattern = "www.chillmypet.com"
custom_domain = true
